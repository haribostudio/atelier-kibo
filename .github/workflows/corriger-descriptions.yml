name: Corriger les descriptions
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corriger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer les corrections
        run: |
          python3 - <<'PYEOF'
          import json

          def maj(f, paires):
              c = open(f, encoding='utf-8').read()
              for a, b in paires:
                  if a not in c:
                      print(f"ATTENTION {f}: introuvable -> {a[:60]}")
                  c = c.replace(a, b)
              open(f, 'w', encoding='utf-8').write(c)

          maj('produit-vertigo.html', [
              ("ponctuées d'argent vieilli, de perles noires et de smileys bleus", "ponctuées d'argent vieilli et de smileys bleus"),
          ])
          maj('produit-eclipse.html', [
              ("Des perles d'eau douce blanches et sombres, séparées par des fleurs d'argent.", "Des perles d'eau douce blanches et des perles noires de Tahiti, ponctuées d'une délicate fleur en argent — une pièce graphique où se rencontrent ombre et lumière."),
          ])
          maj('produit-limone.html', [
              ("du verre citron, vert et jaune", "du verre vert et jaune"),
              ("verre citron", "verre vert et jaune"),
          ])
          maj('produit-amuleto.html', [
              ("des petites mains rouges", "des petits chats rouges"),
              ("mains rouges", "chats rouges"),
          ])
          maj('produit-bodrum.html', [
              ("Du verre azur, des fleurs bleues et des yeux protecteurs, comme un été turc.", "Des perles d'eau douce, du verre azur, des fleurs bleues et des yeux protecteurs, comme un été turc."),
              ("Verre azur, fleurs bleues — œil protecteur", "Perles d'eau douce, verre azur, fleurs bleues — œil protecteur"),
          ])
          maj('produit-rosa.html', [
              ("fleur en verre", "grande fleur"),
          ])
          maj('produit-oliva.html', [
              ("grappe de fleurs en verre", "grappe de fleurs"),
          ])

          t = json.load(open('tools/traductions-extra.json', encoding='utf-8'))
          t["Des perles d'eau douce ponctuées d'argent vieilli et de smileys bleus. Monté à la main à l'atelier, à Paris."] = "Freshwater pearls punctuated with aged silver and blue smileys. Assembled by hand at the atelier, in Paris."
          t["Des perles d'eau douce blanches et des perles noires de Tahiti, ponctuées d'une délicate fleur en argent — une pièce graphique où se rencontrent ombre et lumière. Monté à la main à l'atelier, à Paris."] = "White freshwater pearls and black Tahitian pearls, punctuated with a delicate silver flower — a graphic piece where shadow and light meet. Assembled by hand at the atelier, in Paris."
          t["Des perles d'eau douce et du verre vert et jaune, semé de smileys. Monté à la main à l'atelier, à Paris."] = "Freshwater pearls and green-and-yellow glass, scattered with smileys. Assembled by hand at the atelier, in Paris."
          t["Des perles d'eau douce, des petits chats rouges et des yeux protecteurs. Monté à la main à l'atelier, à Paris."] = "Freshwater pearls, little red cats and protective eyes. Assembled by hand at the atelier, in Paris."
          t["Des perles d'eau douce, du verre azur, des fleurs bleues et des yeux protecteurs, comme un été turc. Monté à la main à l'atelier, à Paris."] = "Freshwater pearls, azure glass, blue flowers and protective eyes, like a Turkish summer. Assembled by hand at the atelier, in Paris."
          t["De la nacre rose pastel, des perles d'eau douce et une grande fleur. Monté à la main à l'atelier, à Paris."] = "Pastel pink mother-of-pearl, freshwater pearls and a large flower. Assembled by hand at the atelier, in Paris."
          t["Des perles d'eau douce, du verre vert d'eau et une grappe de fleurs. Monté à la main à l'atelier, à Paris."] = "Freshwater pearls, water-green glass and a cluster of flowers. Assembled by hand at the atelier, in Paris."
          t["Perles et verre vert et jaune — smileys verts"] = "Pearls and green-and-yellow glass — green smileys"
          t["Perles, chats rouges — yeux protecteurs"] = "Pearls, red cats — protective eyes"
          t["Perles d'eau douce, verre azur, fleurs bleues — œil protecteur"] = "Freshwater pearls, azure glass, blue flowers — protective eye"
          t["Nacre rose pastel — grande fleur"] = "Pastel pink mother-of-pearl — large flower"
          json.dump(t, open('tools/traductions-extra.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print("OK corrections + traductions")
          PYEOF
      - name: Commit et push
        run: |
          git config user.name kibo-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Corrections descriptions : Vertigo, Eclipse, Limone, Amuleto, Bodrum, Rosa, Oliva"
          git push
