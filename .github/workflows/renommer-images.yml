name: Renommer les images produits
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  renommer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renommer images + liens
        run: |
          git mv "produit-palermo-bracelet.jpg" "produit-vertigo-bracelet.jpg"
          git mv "produit-palermo-2.jpg" "produit-vertigo-2.jpg"
          git mv "produit-palermo.jpg" "produit-vertigo.jpg"
          git mv "produit-tahiti-bracelet.jpg" "produit-eclipse-bracelet.jpg"
          git mv "produit-tahiti.jpg" "produit-eclipse.jpg"
          git mv "produit-casablanca-bracelet.jpg" "produit-halo-bracelet.jpg"
          git mv "produit-casablanca.jpg" "produit-halo.jpg"
          git mv "produit-bianca-2.jpg" "produit-mosaique-2.jpg"
          git mv "produit-bianca.jpg" "produit-mosaique.jpg"
          for f in *.html en/*.html; do
            sed -i \
              -e 's/produit-palermo-bracelet\.jpg/produit-vertigo-bracelet.jpg/g' \
              -e 's/produit-palermo-2\.jpg/produit-vertigo-2.jpg/g' \
              -e 's/produit-palermo\.jpg/produit-vertigo.jpg/g' \
              -e 's/produit-tahiti-bracelet\.jpg/produit-eclipse-bracelet.jpg/g' \
              -e 's/produit-tahiti\.jpg/produit-eclipse.jpg/g' \
              -e 's/produit-casablanca-bracelet\.jpg/produit-halo-bracelet.jpg/g' \
              -e 's/produit-casablanca\.jpg/produit-halo.jpg/g' \
              -e 's/produit-bianca-2\.jpg/produit-mosaique-2.jpg/g' \
              -e 's/produit-bianca\.jpg/produit-mosaique.jpg/g' \
              "$f"
          done
          printf '%s\n' \
            '/produit-palermo.jpg /produit-vertigo.jpg 301' \
            '/produit-palermo-2.jpg /produit-vertigo-2.jpg 301' \
            '/produit-palermo-bracelet.jpg /produit-vertigo-bracelet.jpg 301' \
            '/produit-tahiti.jpg /produit-eclipse.jpg 301' \
            '/produit-tahiti-bracelet.jpg /produit-eclipse-bracelet.jpg 301' \
            '/produit-casablanca.jpg /produit-halo.jpg 301' \
            '/produit-casablanca-bracelet.jpg /produit-halo-bracelet.jpg 301' \
            '/produit-bianca.jpg /produit-mosaique.jpg 301' \
            '/produit-bianca-2.jpg /produit-mosaique-2.jpg 301' >> _redirects
      - name: Commit et push
        run: |
          git config user.name kibo-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Renommage des images produits (Vertigo, Eclipse, Halo, Mosaïque) + redirections"
          git push
