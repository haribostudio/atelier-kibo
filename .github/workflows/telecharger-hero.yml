name: Telecharger le hero
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Telecharger et verifier
        run: |
          curl -sL "https://tmpfiles.org/dl/whwrrtDiUrmM/hero-456.jpg" -o hero-456.jpg
          echo "636fd583c29d64dd8e0a10f2ee4db990  hero-456.jpg" | md5sum -c -
          ls -la hero-456.jpg
      - name: Commit
        run: |
          git config user.name kibo-bot
          git config user.email bot@atelier-kibo.com
          git add hero-456.jpg
          git commit -m "Ajout de la photo hero-456"
          git push
