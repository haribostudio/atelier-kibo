name: Generer la version anglaise
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'kibo-panier.js'
      - 'tools/**'
      - '.github/workflows/version-anglaise.yml'
permissions:
  contents: write
jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generer les pages en anglais
        run: |
          base64 -d tools/generer_en.b64 > /tmp/generer_en.py
          python3 /tmp/generer_en.py .
      - name: Commit et push
        run: |
          git config user.name kibo-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Version anglaise du site (en/) + hreflang"
          git push
